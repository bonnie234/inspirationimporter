<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inspiration Importer</title>

  <style>
    :root {
      --bg: #faf7f3;
      --panel: #f4efe7;
      --paper: #fdfbf8;
      --text: #111111;
      --muted: #6b655d;
      --border: #cfc7bb;
      --soft-border: #ddd5ca;
      --accent: #111111;
      --accent-dark: #000000;
      --danger: #9f2f2a;
      --success: #315b3b;
      --selection: #eee9e2;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 420px;
      height: 720px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body {
      font: 12px/1.45 Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }

    button:focus-visible,
    input:focus-visible {
      outline: 1px solid var(--text);
      outline-offset: 2px;
    }

    .app {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      height: 720px;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .title {
      margin: 0;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .title-row::before {
      content: "";
      width: 15px;
      height: 15px;
      display: inline-block;
      flex: 0 0 auto;
      background: var(--text);
      transform: rotate(6deg);
    }

    .beta-badge {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 8px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0 0 0 23px;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 19px;
      line-height: 1.05;
      letter-spacing: -.025em;
    }

    .card {
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .url-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0;
    }

    input[type="url"] {
      width: 100%;
      min-width: 0;
      height: 40px;
      border: 1px solid var(--text);
      border-right: 0;
      border-radius: 0;
      background: var(--paper);
      color: var(--text);
      padding: 0 11px;
      outline: none;
    }

    input[type="url"]::placeholder { color: #928b82; }

    input[type="url"]:focus {
      border-color: var(--text);
      box-shadow: inset 0 0 0 1px var(--text);
    }

    .button {
      min-height: 30px;
      border: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      color: var(--text);
      padding: 6px 9px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }

    .button:hover {
      background: var(--selection);
      border-color: var(--text);
    }

    .button:active { transform: none; }
    .button:disabled { opacity: .32; cursor: not-allowed; }

    .button.primary {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
    }

    .button.primary:hover {
      background: #292724;
      border-color: #292724;
    }

    #extractBtn {
      height: 40px;
      padding-inline: 14px;
    }

    .toolbar, .batch-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .batch-row {
      flex: 0 0 auto;
      padding: 8px 0 10px;
      border-bottom: 1px solid var(--border);
    }

    #importBtn { margin-left: auto; }

    .filter-btn[aria-pressed="true"] {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
    }

    .quality-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 86px;
      gap: 12px;
      align-items: end;
      margin-top: 10px;
    }

    .quality-note {
      padding-bottom: 5px;
      text-align: right;
      color: var(--muted);
    }

    .quality-label {
      display: block;
      margin-bottom: 2px;
      font-size: 8px;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .quality-note strong {
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      font-style: italic;
      font-weight: 400;
    }

    .status {
      min-height: 31px;
      max-height: 52px;
      overflow: auto;
      padding: 7px 9px;
      border: 1px solid var(--soft-border);
      border-radius: 0;
      background: rgba(255,255,255,.22);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
      word-break: break-word;
    }

    .status.error {
      border-color: rgba(159,47,42,.45);
      background: rgba(159,47,42,.045);
      color: var(--danger);
    }

    .status.success {
      border-color: rgba(49,91,59,.35);
      background: rgba(49,91,59,.045);
      color: var(--success);
    }

    .status.busy {
      border-color: var(--text);
      color: var(--text);
      background: rgba(255,255,255,.25);
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      overflow: hidden;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar h2, .results h2 {
      margin: 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .favorites-list {
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 330px;
    }

    .favorite-item {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 6px;
      align-items: center;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      cursor: pointer;
    }

    .favorite-item img {
      width: 24px;
      height: 24px;
      object-fit: cover;
      border-radius: 0;
      background: var(--paper);
    }

    .favorite-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
      min-height: 0;
      flex: 1;
      overflow: hidden;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      flex: 0 0 auto;
      padding-top: 1px;
    }

    #resultCount {
      text-align: right;
      font-size: 9px;
      line-height: 1.25;
      letter-spacing: .03em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
      gap: 8px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      flex: 1 1 auto;
      padding: 0 6px 18px 0;
      scrollbar-gutter: stable;
    }

    .grid::-webkit-scrollbar { width: 6px; }
    .grid::-webkit-scrollbar-track { background: transparent; }
    .grid::-webkit-scrollbar-thumb { background: #beb5a9; }

    .asset-card {
      position: relative;
      background: rgba(255,255,255,.16);
      border: 1px solid var(--border);
      border-radius: 0;
      overflow: hidden;
      min-height: 198px;
    }

    .asset-card.tiny { border-style: dashed; }

    .asset-card.selected {
      border-color: var(--text);
      box-shadow: inset 0 0 0 1px var(--text);
    }

    .thumb-wrap {
      height: 112px;
      min-height: 112px;
      display: grid;
      place-items: center;
      background-color: var(--paper);
      background-image:
        linear-gradient(45deg, rgba(17,17,17,.035) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(17,17,17,.035) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(17,17,17,.035) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(17,17,17,.035) 75%);
      background-size: 14px 14px;
      background-position: 0 0, 0 7px, 7px -7px, -7px 0;
      border-bottom: 1px solid var(--soft-border);
    }

    .thumb-wrap img {
      max-width: 100%;
      max-height: 112px;
      min-width: 18px;
      min-height: 18px;
      object-fit: contain;
    }

    .asset-card.tiny .thumb-wrap img {
      min-width: 28px;
      min-height: 28px;
      image-rendering: pixelated;
    }

    .thumb-fallback {
      display: grid;
      gap: 3px;
      place-items: center;
      padding: 7px 8px;
      background: transparent;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      text-align: center;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .thumb-fallback span {
      font-weight: 400;
      font-size: 8px;
      letter-spacing: .03em;
      text-transform: none;
    }

    .asset-card.preview-failed { opacity: .72; }

    .asset-actions {
      position: absolute;
      top: 7px;
      left: 7px;
      right: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 2;
    }

    .asset-actions input, .favorite-btn { pointer-events: auto; }

    .asset-actions input {
      appearance: none;
      width: 22px;
      height: 22px;
      margin: 0;
      border: 1px solid var(--text);
      border-radius: 0;
      background: rgba(244,239,231,.94);
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .asset-actions input:checked {
      background: var(--text);
    }

    .asset-actions input:checked::after {
      content: "✓";
      color: var(--bg);
      font-size: 13px;
      line-height: 1;
    }

    .favorite-btn {
      border: 1px solid rgba(17,17,17,.45);
      border-radius: 0;
      width: 22px;
      height: 22px;
      padding: 0;
      background: rgba(244,239,231,.94);
      color: var(--text);
      cursor: pointer;
      line-height: 20px;
    }

    .favorite-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 8px 10px;
      font-size: 9px;
      line-height: 1.25;
      color: var(--muted);
      min-width: 0;
    }

    .meta strong {
      color: var(--text);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .meta .url, .source-link {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .source-link {
      color: var(--text);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .source-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .copy-link {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .copy-link:hover, .source-link:hover { color: #000; }

    .asset-card.preview-failed .thumb-fallback { min-height: 54px; }

    .tiny-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .02em;
      padding: 4px 1px;
      margin: 0;
      text-transform: none;
    }

    .tiny-toggle input {
      margin: 0;
      accent-color: var(--text);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 32px 12px;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 13px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .asset-card, .button { transition: background .15s ease, border-color .15s ease, opacity .15s ease; }
    }
  </style>

</head>
<body>
  <main class="app" aria-label="Inspiration Importer panel">
    <header class="header">
      <div>
        <div class="title-row"><h1 class="title">Inspiration Importer</h1><span class="beta-badge">BETA</span></div>
        <p class="subtitle">Bring it into Figma.</p>
      </div>
    </header>

    <section class="card" aria-label="Website extraction controls">
      <label for="urlInput">Website or direct image URL</label>
      <div class="url-row">
        <input id="urlInput" type="url" inputmode="url" placeholder="https://example.com" autocomplete="off" />
        <button id="extractBtn" class="button primary" type="button">Extract Assets</button>
      </div>

      <div class="quality-row">
        <div>
          <label>Format</label>
          <div class="toolbar" role="group" aria-label="Format filters">
            <button class="button filter-btn" data-format="all" aria-pressed="true" type="button">All</button>
            <button class="button filter-btn" data-format="svg" aria-pressed="false" type="button">SVG</button>
            <button class="button filter-btn" data-format="png" aria-pressed="false" type="button">PNG</button>
            <button class="button filter-btn" data-format="jpg" aria-pressed="false" type="button">JPG</button>
            <button class="button filter-btn" data-format="webp" aria-pressed="false" type="button">WEBP</button>
            <button class="button filter-btn" data-format="avif" aria-pressed="false" type="button">AVIF</button>
          </div>
        </div>
        <div class="quality-note" title="Inspiration Importer uses the best available source and resizes only when needed for Figma safety.">
          <span class="quality-label">Quality</span>
          <strong>Best available</strong>
        </div>
      </div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite">Paste a public website or direct image URL. We’ll find the visual assets worth exploring.</div>

    <section class="card batch-row" aria-label="Batch actions">
      <button id="selectAllBtn" class="button" type="button">Select Visible</button>
      <button id="deselectAllBtn" class="button" type="button">Deselect All</button>
      <label class="tiny-toggle" title="Hide 1x1 tracking pixels, spacers, and very small micro-icons from large sites."><input id="hideTinyToggle" type="checkbox" checked /> Hide tiny</label>
      <button id="importBtn" class="button primary" type="button" disabled>Import Selected</button>
    </section>

    <section class="content">
      <aside class="card sidebar" aria-label="Favorites collection">
        <h2>Favorites</h2>
        <div id="favoritesList" class="favorites-list"></div>
      </aside>

      <section class="results" aria-label="Extracted image results">
        <div class="summary-row">
          <h2>Images</h2>
          <span id="resultCount">0 found</span>
        </div>
        <div id="imageGrid" class="grid">
          <div class="empty">Extracted assets will appear here.</div>
        </div>
      </section>
    </section>
  </main>
  <script>
(() => {
  const SCRAPER_BACKEND_URL = 'https://inspirationimporter.onrender.com';

  const state = {
    assets: [],
    selectedIds: new Set(),
    favorites: [],
    activeFormat: 'all',
    hideTiny: true,
    hideUnavailable: true,
    busy: false,
  };

  const els = {
    urlInput: document.getElementById('urlInput'),
    extractBtn: document.getElementById('extractBtn'),
    status: document.getElementById('status'),
    grid: document.getElementById('imageGrid'),
    count: document.getElementById('resultCount'),
    selectAllBtn: document.getElementById('selectAllBtn'),
    deselectAllBtn: document.getElementById('deselectAllBtn'),
    importBtn: document.getElementById('importBtn'),
    hideTinyToggle: document.getElementById('hideTinyToggle'),
    hideUnavailableToggle: document.getElementById('hideUnavailableToggle'),
    favoritesList: document.getElementById('favoritesList'),
    filterButtons: Array.from(document.querySelectorAll('.filter-btn')),
  };

  const post = (message) => parent.postMessage({ pluginMessage: message }, '*');

  function setStatus(text, tone = 'default') {
    els.status.textContent = text;
    els.status.className = `status${tone === 'default' ? '' : ` ${tone}`}`;
  }

  function normalizeUrlInput(raw) {
    const value = raw.trim().replace(/[\u200B-\u200D\uFEFF]/g, '');
    if (!value) return '';
    if (/^https?:\/\//i.test(value)) return value;
    return `https://${value}`;
  }

  function isDirectImageUrl(url) {
    return /\.(svg|png|jpe?g|webp|avif)(?:[?#].*)?$/i.test(String(url || ''));
  }

  function backendExtractUrl(url, quality) {
    return SCRAPER_BACKEND_URL.replace(/\/$/, '') + '/extract?url=' + encodeURIComponent(url) + '&quality=' + encodeURIComponent(quality || 'high');
  }

  function backendAssetDataUrl(url, referer) {
    var out = SCRAPER_BACKEND_URL.replace(/\/$/, '') + '/asset-data?url=' + encodeURIComponent(url);
    if (referer) out += '&referer=' + encodeURIComponent(referer);
    return out;
  }

  function friendlyExtractionError(detail, rawUrl) {
    const message = String(detail || '');
    const blockedMatch = message.match(/HTTP[_ ]?(401|402|403|406|407|409|410|418|429|451|503)/i);
    if (blockedMatch) {
      const code = blockedMatch[1];
      const host = getHostname(rawUrl);
      return 'This site blocks extraction. Try another public page or use a direct image URL instead.';
    }
    if (/HTTP[_ ]?404|404/i.test(message)) {
      return 'Page not found. Check the URL and try again.';
    }
    if (/HTTP[_ ]?500|HTTP[_ ]?502|HTTP[_ ]?504|500|502|504/i.test(message)) {
      return 'The website or scraper had a temporary server error. Try again in a moment, or test a different page.';
    }
    if (/Failed to fetch|BACKEND_UNAVAILABLE|NetworkError|TypeError/i.test(message)) {
      return 'Could not reach the hosted scraper. The service may be waking up or temporarily unavailable. Try again in a moment.';
    }
    return 'Extraction could not complete for this page. Try another public URL or paste a direct image link.';
  }

  function getHostname(url) {
    try {
      return String(url || '').replace(/^https?:\/\//i, '').split('/')[0] || 'This website';
    } catch (error) {
      return 'This website';
    }
  }

  function setBusy(isBusy) {
    state.busy = isBusy;
    els.extractBtn.disabled = isBusy;
    els.importBtn.disabled = isBusy || state.selectedIds.size === 0;
  }

  function loadFavoritesLocal() {
    try {
      const stored = localStorage.getItem('inspiration-importer:favorites');
      state.favorites = stored ? JSON.parse(stored) : [];
    } catch (error) {
      state.favorites = [];
    }
    renderFavorites();
    // Do not request figma.clientStorage on startup. In some dev/plugin contexts
    // it causes a generic "Something went wrong" status before the user acts.
  }

  function saveFavorites() {
    localStorage.setItem('inspiration-importer:favorites', JSON.stringify(state.favorites));
    // localStorage is enough for the local MVP. Avoid startup/storage bridge errors.
    renderFavorites();
    renderGrid();
  }

  function isFavorite(idOrUrl) {
    return state.favorites.some((asset) => asset.id === idOrUrl || asset.src === idOrUrl);
  }

  function toggleFavorite(asset) {
    const exists = isFavorite(asset.id) || isFavorite(asset.src);
    if (exists) {
      state.favorites = state.favorites.filter((fav) => fav.id !== asset.id && fav.src !== asset.src);
    } else {
      state.favorites.unshift({
        id: asset.id,
        src: asset.src,
        sourceUrl: asset.sourceUrl,
        format: asset.format,
        width: asset.width,
        height: asset.height,
        fileSize: asset.fileSize,
        alt: asset.alt || '',
      });
      state.favorites = state.favorites.slice(0, 50);
    }
    saveFavorites();
  }

  function isTinyAsset(asset) {
    var width = Number(asset.width || 0);
    var height = Number(asset.height || 0);
    if (!width || !height) return false;
    return width <= 24 || height <= 24;
  }

  function visibleAssets() {
    return state.assets.filter(function(asset) {
      var formatMatches = state.activeFormat === 'all' || asset.format === state.activeFormat;
      var sizeMatches = !state.hideTiny || !isTinyAsset(asset);
      var previewMatches = !state.hideUnavailable || !asset.previewFailed;
      return formatMatches && sizeMatches && previewMatches;
    });
  }

  function assetArea(asset) {
    var width = Number(asset.width || 0);
    var height = Number(asset.height || 0);
    return width > 0 && height > 0 ? width * height : 0;
  }

  function assetUsefulnessScore(asset) {
    var score = 0;
    var area = assetArea(asset);
    var source = String(asset.originalSrc || asset.sourceUrl || asset.remoteSrc || asset.src || '').toLowerCase();
    var alt = String(asset.alt || '').toLowerCase();
    var text = source + ' ' + alt;

    if (asset.previewFailed) score -= 1000;
    if (isTinyAsset(asset)) score -= 600;

    if (asset.format === 'jpg' || asset.format === 'jpeg' || asset.format === 'png' || asset.format === 'webp' || asset.format === 'avif') score += 300;
    if (asset.format === 'svg') score += 170;

    if (/logo|hero|banner|product|campaign|photo|image|media|card|thumbnail|og:image/.test(text)) score += 180;
    if (/sprite|pixel|tracker|tracking|beacon|spacer|blank|transparent|favicon/.test(text)) score -= 220;

    score += Math.min(900, area / 1200);
    if (asset.fileSize) score += Math.min(250, Number(asset.fileSize) / 12000);
    return score;
  }

  function sortUsefulAssets(a, b) {
    var scoreDiff = assetUsefulnessScore(b) - assetUsefulnessScore(a);
    if (scoreDiff !== 0) return scoreDiff;
    return assetArea(b) - assetArea(a);
  }

  function normalizedAssetIdentity(asset) {
    var candidates = [
      asset.originalSrc,
      asset.remoteSrc,
      asset.sourceUrl,
      asset.src
    ].filter(Boolean).map(String);

    function repeatedlyDecode(value) {
      var out = value;
      for (var i = 0; i < 3; i += 1) {
        try {
          var next = decodeURIComponent(out);
          if (next === out) break;
          out = next;
        } catch (_error) { break; }
      }
      return out;
    }

    function clean(value) {
      var decoded = repeatedlyDecode(value);

      // CDN/proxy URLs often contain the real source URL as their final segment.
      // Prefer the last embedded http(s) URL because it is usually the original asset.
      var embedded = decoded.match(/https?:\/\/[^\s"'<>]+/gi);
      if (embedded && embedded.length > 1) decoded = embedded[embedded.length - 1];

      try {
        var parsed = new URL(decoded);
        // Remove query params that describe responsive size/crop/quality rather than identity.
        [
          'w','width','h','height','size','resize','fit','crop','quality','q',
          'dpr','device-pixel-ratio','auto','format','fm'
        ].forEach(function(key) { parsed.searchParams.delete(key); });
        decoded = parsed.origin + parsed.pathname;
      } catch (_error) {
        decoded = decoded.replace(/[?#].*$/, '');
      }

      return decoded
        .replace(/(?:^|[\/_-])(?:w|width|h|height)[_-]?\d+(?=[\/_.-]|$)/gi, '')
        .replace(/(?:^|[\/_-])\d{2,5}x\d{2,5}(?=[\/_.-]|$)/gi, '')
        .replace(/smartcrop[_-]?w\d+[_-]?h\d+(?:;?format[_-]?[a-z0-9]+)?/gi, '')
        .replace(/(?:^|[\/_-])(?:resize|crop|fit)[_-]?\d+(?:x\d+)?(?=[\/_.-]|$)/gi, '')
        .replace(/[_-](?:w|h)\d{2,5}(?=[_.-])/gi, '')
        .replace(/[_-]\d{2,5}x\d{2,5}(?=\.[a-z0-9]+$)/gi, '')
        .replace(/\/+/g, '/')
        .replace(/\/$/, '')
        .toLowerCase();
    }

    var identities = candidates.map(clean).filter(Boolean);

    // Prefer an identity ending in an actual image filename. This catches URLs like
    // Yahoo/lightyear smartcrop/.../https://cdn.example.com/photo.jpg.
    var imageIdentity = identities.find(function(value) {
      return /\.(?:svg|png|jpe?g|webp|avif)$/i.test(value);
    });

    return imageIdentity || identities[0] || asset.id || '';
  }

  function bestQualityAssets(assets) {
    var bestByIdentity = new Map();
    var order = [];

    assets.forEach(function(asset) {
      var key = normalizedAssetIdentity(asset);

      // If extraction supplied a stable family/candidate identifier, use it.
      var family = asset.srcsetGroup || asset.imageGroup || asset.family || asset.originalSrc || '';
      if (family) {
        var familyKey = normalizedAssetIdentity({
          originalSrc: family,
          remoteSrc: family,
          sourceUrl: family,
          src: family,
          id: asset.id
        });
        if (familyKey) key = familyKey;
      }

      if (!key) key = asset.id || createId();

      if (!bestByIdentity.has(key)) {
        bestByIdentity.set(key, asset);
        order.push(key);
        return;
      }

      var current = bestByIdentity.get(key);
      var currentArea = assetArea(current);
      var candidateArea = assetArea(asset);

      var candidateIsBetter =
        candidateArea > currentArea ||
        (candidateArea === currentArea &&
          Number(asset.fileSize || 0) > Number(current.fileSize || 0));

      if (candidateIsBetter) bestByIdentity.set(key, asset);
    });

    return order.map(function(key) { return bestByIdentity.get(key); });
  }

  function currentAssets() {
    return bestQualityAssets(visibleAssets()).slice().sort(sortUsefulAssets);
  }

  function updateResultsSummary(assets) {
    var readyAssets = assets.filter(function(asset) { return !asset.previewFailed; });
    var ready = readyAssets.length;
    els.count.textContent = ready ? ready + ' asset' + (ready === 1 ? '' : 's') : '0 assets';
  }

  function formatBytes(bytes) {
    if (!bytes || Number.isNaN(Number(bytes))) return 'File size unavailable';
    const units = ['B', 'KB', 'MB'];
    let size = Number(bytes);
    let unit = 0;
    while (size >= 1024 && unit < units.length - 1) {
      size /= 1024;
      unit += 1;
    }
    return `${size.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
  }

  function dimensionsText(asset) {
    if (asset.width && asset.height) return `${asset.width} × ${asset.height} px`;
    return 'Dimensions unavailable';
  }

  function displayFormat(asset) {
    var format = String(asset.format || 'asset').toUpperCase();
    return format === 'ASSET' ? 'Asset' : format + ' image';
  }

  function sourceLink(asset) {
    return asset.originalSrc || asset.sourceUrl || asset.remoteSrc || asset.src || '';
  }

  function updateImportButton() {
    els.importBtn.disabled = state.busy || state.selectedIds.size === 0;
    els.importBtn.textContent = state.selectedIds.size > 0 ? `Import Selected (${state.selectedIds.size})` : 'Import Selected';
  }

  function updateAssetDimensions(id, img) {
    const asset = state.assets.find((item) => item.id === id);
    if (!asset) return;
    const width = img.naturalWidth || asset.width;
    const height = img.naturalHeight || asset.height;
    if (width && height && (asset.width !== width || asset.height !== height)) {
      asset.width = width;
      asset.height = height;
      const card = document.querySelector(`[data-asset-id="${CSS.escape(id)}"]`);
      if (card) {
        const dims = card.querySelector('.dimensions');
        if (dims) dims.textContent = dimensionsText(asset);
      }
    }
  }

  function updatePreviewCheckStatus() {
    var candidates = bestQualityAssets(state.assets).filter(function(asset) {
      return !state.hideTiny || !isTinyAsset(asset);
    });

    if (!candidates.length) return;

    var unchecked = candidates.filter(function(asset) {
      return !asset.previewChecked && !asset.previewFailed;
    }).length;

    if (unchecked > 0) {
      setStatus('Checking ' + candidates.length + ' assets…', 'busy');
      return;
    }

    var ready = candidates.filter(function(asset) { return !asset.previewFailed; }).length;
    setStatus(ready + ' asset' + (ready === 1 ? '' : 's') + ' ready to import.', ready ? 'success' : 'default');
  }

  function renderGrid() {
    const assets = currentAssets();
    updateResultsSummary(assets);

    if (!assets.length) {
      els.grid.innerHTML = '<div class="empty">No assets match the current filters.</div>';
      updateImportButton();
      return;
    }

    const fragment = document.createDocumentFragment();
    assets.forEach((asset) => {
      const card = document.createElement('article');
      card.className = `asset-card${state.selectedIds.has(asset.id) ? ' selected' : ''}${isTinyAsset(asset) ? ' tiny' : ''}`;
      card.dataset.assetId = asset.id;

      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumb-wrap';
      const img = document.createElement('img');
      img.loading = 'eager';
      img.alt = asset.alt || asset.format || 'Extracted website asset';
      img.referrerPolicy = 'no-referrer';
      img.src = asset.thumbnail || asset.src;
      img.addEventListener('load', () => {
        asset.previewChecked = true;
        updateAssetDimensions(asset.id, img);
        updateResultsSummary(currentAssets());
        updatePreviewCheckStatus();
      });
      img.addEventListener('error', () => {
        asset.previewFailed = true;
        asset.previewChecked = true;
        img.remove();
        if (state.hideUnavailable) {
          card.remove();
          updateResultsSummary(currentAssets());
          updatePreviewCheckStatus();
          return;
        }
        var fallback = document.createElement('div');
        card.classList.add('preview-failed');
        fallback.className = 'thumb-fallback';
        fallback.innerHTML = '<strong>' + (asset.format || 'asset').toUpperCase() + '</strong><span>Preview unavailable</span>';
        thumbWrap.appendChild(fallback);
        updateResultsSummary(currentAssets());
        updatePreviewCheckStatus();
      });
      thumbWrap.appendChild(img);

      const actions = document.createElement('div');
      actions.className = 'asset-actions';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = state.selectedIds.has(asset.id);
      checkbox.setAttribute('aria-label', `Select ${asset.format.toUpperCase()} image`);
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) state.selectedIds.add(asset.id);
        else state.selectedIds.delete(asset.id);
        card.classList.toggle('selected', checkbox.checked);
        updateImportButton();
      });

      const fav = document.createElement('button');
      fav.type = 'button';
      fav.className = `favorite-btn${isFavorite(asset.id) || isFavorite(asset.src) ? ' active' : ''}`;
      fav.title = 'Save favorite';
      fav.textContent = isFavorite(asset.id) || isFavorite(asset.src) ? '★' : '☆';
      fav.addEventListener('click', () => toggleFavorite(asset));

      actions.append(checkbox, fav);

      const meta = document.createElement('div');
      meta.className = 'meta';
      var directUrl = sourceLink(asset);
      var directLink = directUrl && /^https?:\/\//i.test(directUrl)
        ? '<span class="source-actions"><a class="source-link" href="' + escapeHtml(directUrl) + '" target="_blank" rel="noopener noreferrer" title="' + escapeHtml(directUrl) + '">Open source</a><button type="button" class="copy-link" data-copy-url="' + escapeHtml(directUrl) + '">Copy URL</button></span>'
        : '<span class="url" title="' + escapeHtml(directUrl || '') + '">' + escapeHtml(directUrl || 'Source unavailable') + '</span>';
      meta.innerHTML = `
        <strong>${displayFormat(asset)}</strong>
        <span class="dimensions">${dimensionsText(asset)}</span>
        <span>${formatBytes(asset.fileSize)}</span>
        ${directLink}
      `;

      var copyButton = meta.querySelector('[data-copy-url]');
      if (copyButton) {
        copyButton.addEventListener('click', function(event) {
          event.preventDefault();
          event.stopPropagation();
          copyToClipboard(copyButton.getAttribute('data-copy-url') || '');
        });
      }

      card.append(thumbWrap, actions, meta);
      fragment.appendChild(card);
    });

    els.grid.replaceChildren(fragment);
    updateImportButton();
  }

  function renderFavorites() {
    if (!state.favorites.length) {
      els.favoritesList.innerHTML = '<div class="empty">No favorites yet.</div>';
      return;
    }
    const fragment = document.createDocumentFragment();
    state.favorites.forEach((asset) => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'favorite-item';
      item.title = asset.src;
      item.addEventListener('click', () => {
        const existing = state.assets.find((candidate) => candidate.src === asset.src || candidate.id === asset.id);
        if (existing) state.selectedIds.add(existing.id);
        else {
          var restoredAsset = {};
          for (var key in asset) {
            if (Object.prototype.hasOwnProperty.call(asset, key)) restoredAsset[key] = asset[key];
          }
          restoredAsset.id = asset.id || createId();
          state.assets.unshift(restoredAsset);
        }
        setStatus('Favorite added to the current selection.', 'success');
        renderGrid();
      });
      const img = document.createElement('img');
      img.src = asset.thumbnail || asset.src;
      img.alt = asset.alt || 'Favorite image';
      img.referrerPolicy = 'no-referrer';
      const label = document.createElement('span');
      label.textContent = asset.format ? asset.format.toUpperCase() : 'Asset';
      item.append(img, label);
      fragment.appendChild(item);
    });
    els.favoritesList.replaceChildren(fragment);
  }

  function createId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return 'asset-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  async function copyToClipboard(text) {
    if (!text) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
      }
      setStatus('Source URL copied.', 'success');
    } catch (error) {
      setStatus('Could not copy the URL. Use Open source to view it instead.', 'error');
    }
  }

  async function extract() {
    const url = normalizeUrlInput(els.urlInput.value);
    if (!url) {
      setStatus('Paste a public website URL or direct image URL.', 'error');
      return;
    }
    state.assets = [];
    state.selectedIds.clear();
    renderGrid();
    setBusy(true);

    if (isDirectImageUrl(url)) {
      setStatus('Reading direct image URL…', 'busy');
      post({ type: 'extract-url', url, quality: 'high' });
      return;
    }

    setStatus('Extracting website assets…', 'busy');
    try {
      const response = await fetch(backendExtractUrl(url, 'high'), {
        method: 'GET',
        mode: 'cors',
        credentials: 'omit',
        cache: 'no-cache'
      });
      const payload = await response.json().catch(function() { return {}; });
      if (!response.ok) {
        throw new Error(payload.error || ('HTTP_' + response.status));
      }
      state.assets = Array.isArray(payload.assets) ? payload.assets : [];
      state.selectedIds.clear();
      setBusy(false);
      setStatus(state.assets.length ? `Checking ${currentAssets().length} assets…` : 'No supported images were found on that page.', state.assets.length ? 'busy' : 'default');
      renderGrid();
    } catch (error) {
      setBusy(false);
      const detail = error && error.message ? error.message : 'BACKEND_UNAVAILABLE';
      setStatus(friendlyExtractionError(detail, url), 'error');
      renderGrid();
    }
  }

  els.extractBtn.addEventListener('click', extract);
  els.urlInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') extract();
  });

  els.filterButtons.forEach((button) => {
    button.addEventListener('click', () => {
      state.activeFormat = button.dataset.format;
      els.filterButtons.forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      renderGrid();
    });
  });

  if (els.hideTinyToggle) {
    els.hideTinyToggle.checked = state.hideTiny;
    els.hideTinyToggle.addEventListener('change', function() {
      state.hideTiny = els.hideTinyToggle.checked;
      renderGrid();
      setStatus(state.hideTiny ? 'Tiny tracking pixels and micro-icons are hidden.' : 'Showing all extracted assets, including tiny pixels and micro-icons.');
    });
  }

  if (els.hideUnavailableToggle) {
    els.hideUnavailableToggle.checked = !state.hideUnavailable;
    els.hideUnavailableToggle.addEventListener('change', function() {
      state.hideUnavailable = !els.hideUnavailableToggle.checked;
      renderGrid();
      setStatus(state.hideUnavailable ? 'Unavailable assets are hidden.' : 'Showing unavailable assets with Open source and Copy URL.');
    });
  }

  els.selectAllBtn.addEventListener('click', () => {
    currentAssets().forEach((asset) => state.selectedIds.add(asset.id));
    setStatus(`Selected ${currentAssets().length} visible asset${currentAssets().length === 1 ? '' : 's'}.`, 'success');
    renderGrid();
  });

  els.deselectAllBtn.addEventListener('click', () => {
    state.selectedIds.clear();
    setStatus('Selection cleared.');
    renderGrid();
  });


  async function prepareAssetForImport(asset) {
    var prepared = {};
    for (var key in asset) {
      if (Object.prototype.hasOwnProperty.call(asset, key)) prepared[key] = asset[key];
    }

    if (asset.inlineSvg || /^data:image\/svg/i.test(asset.src || '')) {
      return prepared;
    }

    var sourceForBackend = asset.remoteSrc || asset.originalSrc || asset.sourceUrl || asset.src;

    try {
      // Preferred path for website assets: ask the local backend to fetch bytes server-side
      // and return a data URL. This avoids browser-side CORS/hotlink blocks during import.
      if (sourceForBackend && /^https?:\/\//i.test(sourceForBackend) && !/^https?:\/\/localhost:/i.test(sourceForBackend)) {
        var proxyResponse = await fetch(backendAssetDataUrl(sourceForBackend, asset.pageUrl), {
          method: 'GET',
          mode: 'cors',
          credentials: 'omit',
          cache: 'no-cache'
        });
        var payload = await proxyResponse.json().catch(function() { return {}; });
        if (!proxyResponse.ok || !payload.dataUrl) throw new Error(payload.error || ('PROXY_HTTP_' + proxyResponse.status));

        if ((payload.format === 'svg') || /svg/i.test(payload.contentType || '') || /^data:image\/svg/i.test(payload.dataUrl || '')) {
          prepared.inlineSvg = dataUrlToText(payload.dataUrl);
          prepared.fileSize = payload.fileSize || prepared.inlineSvg.length;
          prepared.format = 'svg';
          return prepared;
        }

        var proxiedBlob = dataUrlToBlob(payload.dataUrl);
        var proxiedRaster = await rasterBlobToSafeDataUrl(proxiedBlob, asset, 'high');
        prepared.src = proxiedRaster.dataUrl;
        prepared.remoteSrc = sourceForBackend;
        prepared.fileSize = proxiedRaster.fileSize || payload.fileSize || asset.fileSize || null;
        prepared.width = proxiedRaster.width || asset.width || null;
        prepared.height = proxiedRaster.height || asset.height || null;
        prepared.wasResized = proxiedRaster.wasResized;
        prepared.format = proxiedRaster.format || payload.format || asset.format || 'jpg';
        return prepared;
      }

      // Fallback path for direct image URLs and self-hosted/proxied assets.
      var response = await fetch(asset.src, { method: 'GET', mode: 'cors', credentials: 'omit', cache: 'no-cache' });
      if (!response.ok) throw new Error('HTTP_' + response.status);
      var contentType = response.headers.get('content-type') || '';

      if ((asset.format === 'svg') || /svg/i.test(contentType) || /\.svg(?:[?#]|$)/i.test(asset.src)) {
        var svgText = await response.text();
        prepared.inlineSvg = svgText;
        prepared.fileSize = svgText.length;
        return prepared;
      }

      var blob = await response.blob();
      var raster = await rasterBlobToSafeDataUrl(blob, asset, 'high');
      prepared.src = raster.dataUrl;
      prepared.remoteSrc = asset.src;
      prepared.fileSize = raster.fileSize || blob.size || asset.fileSize || null;
      prepared.width = raster.width || asset.width || null;
      prepared.height = raster.height || asset.height || null;
      prepared.wasResized = raster.wasResized;
      prepared.format = raster.format || asset.format || 'jpg';
      return prepared;
    } catch (error) {
      prepared.importError = error && error.message ? error.message : 'FETCH_FAILED';
      return prepared;
    }
  }

  function maxRasterSideForQuality(quality) {
    if (quality === 'high') return 2048;
    if (quality === 'low') return 900;
    return 1400;
  }

  function jpegQualityForSetting(quality) {
    if (quality === 'high') return 0.92;
    if (quality === 'low') return 0.68;
    return 0.82;
  }

  function rasterBlobToSafeDataUrl(blob, asset, quality) {
    return new Promise(function(resolve, reject) {
      var objectUrl = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function() {
        try {
          var sourceWidth = img.naturalWidth || asset.width || 1;
          var sourceHeight = img.naturalHeight || asset.height || 1;
          var maxSide = maxRasterSideForQuality(quality);
          var scale = Math.min(maxSide / sourceWidth, maxSide / sourceHeight, 1);
          var targetWidth = Math.max(1, Math.round(sourceWidth * scale));
          var targetHeight = Math.max(1, Math.round(sourceHeight * scale));

          var canvas = document.createElement('canvas');
          canvas.width = targetWidth;
          canvas.height = targetHeight;
          var ctx = canvas.getContext('2d');
          if (!ctx) throw new Error('CANVAS_UNAVAILABLE');
          ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

          var shouldKeepPng = (asset.format === 'png') || /png/i.test(blob.type || '');
          var mimeType = shouldKeepPng ? 'image/png' : 'image/jpeg';
          var dataUrl = shouldKeepPng
            ? canvas.toDataURL(mimeType)
            : canvas.toDataURL(mimeType, jpegQualityForSetting(quality));

          URL.revokeObjectURL(objectUrl);
          resolve({
            dataUrl: dataUrl,
            width: targetWidth,
            height: targetHeight,
            fileSize: estimateDataUrlBytes(dataUrl),
            wasResized: scale < 1,
            format: shouldKeepPng ? 'png' : 'jpg',
          });
        } catch (error) {
          URL.revokeObjectURL(objectUrl);
          reject(error);
        }
      };
      img.onerror = function() {
        URL.revokeObjectURL(objectUrl);
        reject(new Error('IMAGE_DECODE_FAILED'));
      };
      img.src = objectUrl;
    });
  }

  function dataUrlToBlob(dataUrl) {
    var parts = String(dataUrl || '').split(',');
    if (parts.length < 2) throw new Error('BAD_DATA_URL');
    var header = parts[0];
    var base64 = parts.slice(1).join(',');
    var mimeMatch = header.match(/^data:([^;]+);base64$/i);
    var mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  function dataUrlToText(dataUrl) {
    var text = String(dataUrl || '');
    var comma = text.indexOf(',');
    if (comma < 0) return text;
    var header = text.slice(0, comma);
    var payload = text.slice(comma + 1);
    if (/;base64/i.test(header)) return atob(payload);
    return decodeURIComponent(payload);
  }

  function estimateDataUrlBytes(dataUrl) {
    var comma = String(dataUrl).indexOf(',');
    var payload = comma >= 0 ? String(dataUrl).slice(comma + 1) : String(dataUrl);
    return Math.round(payload.length * 0.75);
  }

  function blobToDataUrl(blob) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function() { resolve(String(reader.result || '')); };
      reader.onerror = function() { reject(new Error('BLOB_READ_FAILED')); };
      reader.readAsDataURL(blob);
    });
  }

  els.importBtn.addEventListener('click', async () => {
    const selected = state.assets.filter((asset) => state.selectedIds.has(asset.id));
    if (!selected.length) {
      setStatus('Choose at least one image to import.', 'error');
      return;
    }
    setBusy(true);
    setStatus(`Preparing ${selected.length} selected asset${selected.length === 1 ? '' : 's'} for import…`, 'busy');

    var prepared = [];
    for (var i = 0; i < selected.length; i += 1) {
      setStatus(`Preparing asset ${i + 1} of ${selected.length}…`, 'busy');
      prepared.push(await prepareAssetForImport(selected[i]));
    }

    var blocked = prepared.filter(function(asset) { return asset.importError; }).length;
    if (blocked === prepared.length) {
      setBusy(false);
      setStatus('Images were found, but none of the selected assets could be imported. The backend could not fetch their bytes, or the image host blocked/protected those files.', 'error');
      return;
    }

    setStatus(`Importing ${prepared.length - blocked} prepared asset${prepared.length - blocked === 1 ? '' : 's'}…`, 'busy');
    post({ type: 'import-selected', assets: prepared.filter(function(asset) { return !asset.importError; }), quality: 'high' });
  });

  window.onmessage = (event) => {
    const message = event.data.pluginMessage;
    if (!message) return;

    if (message.type === 'extraction-success') {
      setBusy(false);
      state.assets = message.assets || [];
      state.selectedIds.clear();
      setStatus(state.assets.length ? `Checking ${currentAssets().length} assets…` : 'No supported images were found on that page.', state.assets.length ? 'busy' : 'default');
      renderGrid();
      return;
    }

    if (message.type === 'extraction-error') {
      setBusy(false);
      setStatus(message.message || 'Unable to extract images from this URL.', 'error');
      renderGrid();
      return;
    }

    if (message.type === 'import-success') {
      setBusy(false);
      setStatus(`Imported ${message.imported} asset${message.imported === 1 ? '' : 's'} to the Figma canvas.`, 'success');
      return;
    }

    if (message.type === 'import-error') {
      setBusy(false);
      setStatus(message.message || 'Import failed.', 'error');
      return;
    }

    if (message.type === 'favorites-loaded') {
      if (Array.isArray(message.favorites) && message.favorites.length) {
        state.favorites = message.favorites;
        localStorage.setItem('inspiration-importer:favorites', JSON.stringify(state.favorites));
        renderFavorites();
        renderGrid();
      }
    }
  };

  loadFavoritesLocal();
})();

</script>
</body>
</html>
